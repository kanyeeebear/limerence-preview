function money(v) { return new Intl.NumberFormat('uk-UA', {maximumFractionDigits:2}).format(Number(v)) + ' ₴'; }
function priceOf(p) {
  const prices = p.variants.map(v => Number(v.sale || v.price)).filter(n => n > 0);
  if(!prices.length) return 'Ціну не вказано';
  return (new Set(prices).size > 1 ? 'від ' : '') + money(Math.min(...prices));
}
function toast(message) {
  $('#toast').textContent = message; $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 3300);
}
function persist(next) {
  try {localStorage.setItem(STORAGE, JSON.stringify(next)); return true;}
  catch {return false;}
}
function ask(title, text, action, cancel = 'Залишитися') {
  return new Promise(resolve => {
    const d = $('#confirm'); $('#dialog-title').textContent=title; $('#dialog-text').textContent=text;
    $('[value="confirm"]',d).textContent=action; $('[value="cancel"]',d).textContent=cancel;
    d.returnValue=''; d.addEventListener('close',()=>resolve(d.returnValue==='confirm'),{once:true}); d.showModal();
  });
}
async function navigate(next) {
  if(saveBusy) return;
  if(dirty && !(await ask('Залишити зміни?', 'Ви ще не зберегли цю картку. Якщо вийти, внесені тут зміни зникнуть.', 'Вийти без збереження'))) return;
  dirty=false; draft=null; pendingVideo=null;
  if(pendingVideoURL) { URL.revokeObjectURL(pendingVideoURL); pendingVideoURL=''; }

  if(location.hash.slice(1)===next) renderRoute(next); else location.hash=next;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a) {e.preventDefault();navigate(a.getAttribute('href').slice(1));}
});
window.addEventListener('hashchange',async()=>{
  const next=location.hash.slice(1)||'products';
  if(dirty && !(await ask('Залишити зміни?', 'У картці є незбережені зміни.', 'Вийти без збереження'))) {
    history.replaceState(null,'','#'+route);return;

  dirty=false;renderRoute(next);
});

function nav(active) {
  $('#navigation').hidden=false;
  $('#navigation').innerHTML=`<a href="#products" ${active==='products'?'aria-current="page"':''}>${icon('grid')}Товари</a><a href="#site" ${active==='site'?'aria-current="page"':''}>${icon('site')}Сайт</a>`;
}
function card(p) {
  return `<button type="button" class="product-card" data-product="${esc(p.id)}" aria-label="Редагувати ${esc(p.name)}"><div class="product-photo"><img src="${esc(p.photos[0])}" alt="${esc(p.name)}" loading="lazy">${!p.published?'<span class="cover-label">Приховано</span>':''}</div><span class="name">${esc(p.name)}</span><span class="material">${esc(p.material)}</span><span class="price">${esc(priceOf(p))}</span><span class="stock">${p.variants.some(v=>v.available)?'Є в наявності':'Немає в наявності'}</span></button>`;
}
function bindCards(root=document) {$$('[data-product]',root).forEach(b=>b.onclick=()=>navigate('product/'+b.dataset.product));}
function filtered() {
  const q=query.toLocaleLowerCase('uk').trim();
  return products.filter(p=>(category==='Усі'||p.category===category) && (!q||`${p.name} ${p.article} ${p.material}`.toLocaleLowerCase('uk').includes(q)) && (visibility==='all'||(visibility==='stock'&&p.variants.some(v=>v.available))||(visibility==='hidden'&&!p.published)));
}
function listResults() {
  const found=filtered(); $('#result-count').textContent=`Показано ${found.length} із ${products.length}`;
  $('#results').innerHTML=found.length?`<div class="product-grid">${found.map(card).join('')}</div>`:`<div class="empty"><h2>Нічого не знайдено</h2><p>Спробуйте інший артикул або приберіть фільтри.</p><button class="secondary" id="clear-filters">Показати всі товари</button></div>`;

}

function field(label, name, value, type='text', extra='') {

}

  draft=copy(p);draftType='product';photoIndex=0;
  $('#navigation').hidden=true;
  $('#app').innerHTML=`<div class="page editor">${backHeader(p.name,'Артикул '+p.article,'products')}<form id="edit-form"><div id="gallery" class="gallery"></div><section class="section"><h2>Про прикрасу</h2>${field('Назва товару','name',p.name,'text','required maxlength="180"')}<label class="field"><span>Опис</span><textarea name="description" maxlength="10000" rows="6">${esc(p.description)}</textarea></label></section><section class="section">${p.variants.length>1?`<details open><summary>Розміри та ціни ${icon('down')}</summary><p class="help" style="margin:0 0 20px">Кожен розмір має свою ціну й наявність.</p>${p.variants.map(variantFields).join('')}</details>`:`<h2>Ціна та наявність</h2>${variantFields(p.variants[0],0)}`}</section><section class="section">${switchField('Показувати на сайті','published',p.published,'Вимкніть, щоб тимчасово приховати прикрасу.')}</section><p class="form-error" id="form-error" role="alert"></p></form>${saveBar()}</div>`;
  gallery(); bindEditor('products');
}
function setDirty() {dirty=true;if($('#save-status'))$('#save-status').textContent='Є незбережені зміни';}
function bindEditor(back) {
  $('[data-back]').onclick=()=>navigate(back);
  const form=$('#edit-form');
  form.addEventListener('input',()=>{capture();setDirty();});
  form.addEventListener('change',()=>{capture();setDirty();});
  form.onsubmit=saveDraft;
}
function capture() {
  if(!draft||!$('#edit-form'))return;
  const f=new FormData($('#edit-form'));
  if(draftType==='product') {
    draft.name=String(f.get('name')||'');draft.description=String(f.get('description')||'');draft.published=f.has('published');
    draft.variants.forEach((v,i)=>{v.price=String(f.get(`price-${i}`)||'');v.sale=String(f.get(`sale-${i}`)||'');v.available=f.has(`available-${i}`);});
  } else {
    for(const k of ['title','text','button']) if(f.has(k)) draft[k]=String(f.get(k)||'');
    draft.visible=f.has('visible');
    if(draft.kind==='collection')draft.productIds=f.getAll('selected-product');
  }
}
function gallery() {
  const container=$('#gallery');if(!container)return;
  const isProduct=draftType==='product';
  const current=draft.photos[photoIndex] || '';
  const video=videoSource(draft);
  const allowVideo=['hero','category-video'].includes(draft.kind);
  container.innerHTML=`<div class="gallery-main ${!isProduct?'media-photo':''}">${allowVideo&&video?`<video controls playsinline preload="none" poster="${esc(current)}" src="${esc(video)}" aria-label="Перегляд відео"></video>`:`<img src="${esc(current)}" alt="${isProduct?esc(draft.name):'Фото блоку'}">`}${isProduct&&photoIndex===0?'<span class="cover-label">Головне фото</span>':''}</div>${isProduct||draft.kind==='gallery'?`<div class="thumbnails">${draft.photos.map((src,i)=>`<button type="button" class="thumbnail" aria-label="Фото ${i+1}" aria-pressed="${i===photoIndex}" data-photo="${i}"><img src="${esc(src)}" alt=""></button>`).join('')}<button type="button" class="upload-button" id="add-photo" aria-label="Додати фото">${icon('plus')}</button></div><div class="gallery-tools"><button type="button" class="text-button" id="make-cover" ${photoIndex===0?'disabled':''}>Зробити головним</button><button type="button" class="icon-button" id="delete-photo" aria-label="Видалити вибране фото" ${draft.photos.length<2?'disabled':''}>${icon('trash')}</button></div>`:`<div class="media-choice"><button type="button" class="secondary" id="replace-photo">${icon('photo')}${allowVideo?'Змінити обкладинку':'Змінити фото'}</button>${allowVideo?`<button type="button" class="secondary" id="add-video">${icon('video')}${video?'Замінити відео':'Додати відео'}</button>`:''}</div>`}${allowVideo?`<p class="file-note">${draft.videoName?esc(draft.videoName):'Оберіть власне відео з телефону. У макеті воно зберігається тільки на цьому пристрої.'}</p>${video?'<button type="button" id="remove-video" class="text-button">Прибрати відео</button>':''}`:''}<input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden><input type="file" id="video-file" accept="video/*" hidden>`;
  $$('[data-photo]',container).forEach(b=>b.onclick=()=>{photoIndex=Number(b.dataset.photo);gallery();});
  // A single photo needs no duplicated thumbnail or unavailable ordering actions.
  if (draft.photos.length === 1 && (isProduct || draft.kind === 'gallery')) {
    $('.thumbnail', container)?.remove();
    $('.gallery-tools', container)?.remove();
  }
  if ($('#add-photo')) $('#add-photo').innerHTML = icon('plus') + 'Додати фото';
  if($('#make-cover'))$('#make-cover').onclick=()=>{const [img]=draft.photos.splice(photoIndex,1);draft.photos.unshift(img);photoIndex=0;setDirty();gallery();};
  if($('#delete-photo'))$('#delete-photo').onclick=async()=>{if(await ask('Прибрати фото?', 'Фото зникне лише з цієї пробної картки.', 'Прибрати фото','Скасувати')){draft.photos.splice(photoIndex,1);photoIndex=0;setDirty();gallery();}};
  if($('#add-photo'))$('#add-photo').onclick=()=>{$('#photo-file').dataset.replace='no';$('#photo-file').click();};
  if($('#replace-photo'))$('#replace-photo').onclick=()=>{$('#photo-file').dataset.replace='yes';$('#photo-file').click();};
  $('#photo-file').onchange=photoSelected;
  if($('#add-video'))$('#add-video').onclick=()=>$('#video-file').click();
  $('#video-file').onchange=videoSelected;
  if($('#remove-video'))$('#remove-video').onclick=()=>{draft.video='';draft.videoKey='';draft.videoName='';pendingVideo=null;if(pendingVideoURL)URL.revokeObjectURL(pendingVideoURL);pendingVideoURL='';gallery();setDirty();};
}
async function photoSelected(e) {
  const file=e.target.files[0];if(!file)return;
  const replace=e.target.dataset.replace==='yes';
  if(file.size>25*1024*1024){toast('Фото завелике. Оберіть файл до 25 МБ.');return;}
  if(!replace&&draft.photos.length>=8){toast('У макеті можна додати до 8 фото.');return;}
  try {
    const url=URL.createObjectURL(file);const img=new Image();
    try {await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url;});}
    finally {URL.revokeObjectURL(url);}
    const canvas=document.createElement('canvas');const scale=Math.min(1,900/Math.max(img.width,img.height));
    canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    const value=canvas.toDataURL('image/webp',.82);
    if(replace){draft.photos[0]=value;photoIndex=0;}else{draft.photos.push(value);photoIndex=draft.photos.length-1;}
    gallery();setDirty();toast('Фото додано. Натисніть «Зберегти».');
  } catch {toast('Не вдалося відкрити фото. Оберіть JPG, PNG або WebP.');}
}
async function videoSelected(e) {
  const file=e.target.files[0];if(!file)return;
  if(file.size>100*1024*1024){toast('Для макета оберіть відео до 100 МБ.');return;}
  if(!file.type.startsWith('video/')){toast('Оберіть відеофайл.');return;}
  if(pendingVideoURL)URL.revokeObjectURL(pendingVideoURL);
  pendingVideo=file;pendingVideoURL=URL.createObjectURL(file);draft.videoName=file.name;draft.videoKey='';draft.video='';gallery();setDirty();
  const player=$('video',$('#gallery'));
  if(player)player.addEventListener('error',()=>toast('Браузер не відтворює цей формат. Спробуйте MP4 (H.264).'),{once:true});
  toast('Відео вибрано. Перевірте його й збережіть.');
}
function videoSource(b) {
  if(draft&&b.id===draft.id&&pendingVideoURL)return pendingVideoURL;
  return (b.videoKey&&mediaURLs.get(b.videoKey))||b.video||'';
}
function openMediaDB() {
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open('limerence-owner-prototype-media',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('files');
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
  });
}
async function mediaStore(key, blob) {
  const db=await openMediaDB();
  try {await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
  finally {db.close();}
}
async function mediaLoad(key) {
  const db=await openMediaDB();
  try {return await new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  finally {db.close();}
}
async function saveDraft(e) {
  e.preventDefault();if(saveBusy)return;capture();
  const error=$('#form-error');error.textContent='';
  if(draftType==='product') {
    draft.name=draft.name.trim();
    if(!draft.name){error.textContent='Вкажіть назву товару.';return;}
    for(const v of draft.variants) {
      if((v.price!==''&&(!Number.isFinite(Number(v.price))||Number(v.price)<0))||(v.sale!==''&&(!Number.isFinite(Number(v.sale))||Number(v.sale)<0))) {error.textContent='Ціна має бути числом від 0.';return;}
      if(v.sale!==''&&(v.price===''||Number(v.sale)>Number(v.price))){error.textContent='Ціна зі знижкою не може перевищувати звичайну ціну. Перевірте обидва поля.';return;}
    }
  }
  if(draft.kind==='collection'&&!draft.productIds.length){error.textContent='Оберіть хоча б одну прикрасу для цього блоку.';return;}
  if(draft.kind==='collection'&&draft.productIds.length>8){error.textContent='Для блоку новинок оберіть не більше 8 прикрас.';return;}
  saveBusy=true;$('#save').disabled=true;$('#save').textContent='Збереження…';
  try {
    const oldVideoKey=draft.videoKey;
    if(pendingVideo) {
      const key=`${draft.id}-${Date.now()}`;
      await mediaStore(key,pendingVideo);draft.videoKey=key;draft.video='';
      mediaURLs.set(key,URL.createObjectURL(pendingVideo));
    }
    const next=copy(changes);
    if(draftType==='product')next.products[draft.id]=copy(draft);
    else {const list=draftType==='block'?blocks:categoryVideos;next[draftType==='block'?'blocks':'categoryVideos']=list.map(b=>b.id===draft.id?copy(draft):copy(b));}
    if(!persist(next)) {draft.videoKey=oldVideoKey;throw new Error('storage');}
    changes=next;
    if(draftType==='product')products=products.map(p=>p.id===draft.id?copy(draft):p);
    else if(draftType==='block')blocks=next.blocks;else categoryVideos=next.categoryVideos;
    dirty=false;pendingVideo=null;
    if(pendingVideoURL){URL.revokeObjectURL(pendingVideoURL);pendingVideoURL='';}
    // The player must switch from the temporary selection URL to the saved blob.
    if (draft.videoKey) gallery();
    $('#save-status').textContent='Збережено в макеті';toast('Збережено в макеті. Магазин не змінено.');
  } catch {error.textContent='Не вдалося зберегти на пристрої. Можливо, бракує місця. Спробуйте менший файл або скиньте попередні пробні зміни.';}
  finally {saveBusy=false;$('#save').disabled=false;$('#save').innerHTML=icon('check')+'Зберегти';}
}
function blockRow(b,i,reorder=true) {
  const img=b.photos?.[0]||products.find(p=>p.id===b.productIds?.[0])?.photos[0];
  const subtitle=b.kind==='hero'?'Текст, фото та відео':b.kind==='collection'?'Обрати прикраси':b.kind==='category-video'?'Відео та обкладинка':b.kind==='gallery'?'Фото, заголовок та кнопка':'Опис та фото';
  return `<div class="block-row ${!b.visible?'toggle-hidden':''}"><button class="block-open" data-block="${b.id}" data-kind="${reorder?'block':'category'}">${img?`<img src="${esc(img)}" alt="">`:`<span class="block-image-placeholder">${icon('grid')}</span>`}<span class="block-copy"><strong>${esc(b.label)}</strong><small>${!b.visible?'Приховано · ':''}${subtitle}</small></span>${icon('right')}</button>${reorder?`<div class="reorder"><button data-move="${i}:-1" aria-label="Перемістити ${esc(b.label)} вище" ${i===0?'disabled':''}>${icon('up')}</button><button data-move="${i}:1" aria-label="Перемістити ${esc(b.label)} нижче" ${i===blocks.length-1?'disabled':''}>${icon('down')}</button></div>`:''}</div>`;
}
function renderSite() {
  nav('site');
  $('#app').innerHTML=`<div class="page editor"><div class="page-heading"><h1>Сайт</h1><button id="site-preview" class="secondary">${icon('eye')}Переглянути</button></div><p class="site-intro">Торкніться блоку, який хочете змінити.</p><div class="section-head"><h2>Головна сторінка</h2></div><div class="block-list">${blocks.map((b,i)=>blockRow(b,i)).join('')}</div><p class="help">Стрілки змінюють порядок блоків. У макеті порядок зберігається одразу.</p><div class="section-head"><h2>Відео в категоріях</h2></div><p class="help">Два приклади, щоб спробувати завантаження.</p><div class="block-list">${categoryVideos.map((b,i)=>blockRow(b,i,false)).join('')}</div><p class="notice">Тут можна спробувати змінити тексти, фото, відео та порядок блоків. Робочий сайт залишиться без змін.</p><button class="text-button reset-link" id="reset">Скинути всі пробні зміни</button></div>`;
  $('#site-preview').onclick=()=>navigate('preview');$('#reset').onclick=reset;
  $$('[data-block]').forEach(b=>b.onclick=()=>navigate(`${b.dataset.kind}/${b.dataset.block}`));
  $$('[data-move]').forEach(b=>b.onclick=()=>{
    const [i,delta]=b.dataset.move.split(':').map(Number);const next=copy(blocks);[next[i],next[i+delta]]=[next[i+delta],next[i]];
    const updated={...changes,blocks:next};
    if(!persist(updated)){toast('Не вдалося зберегти порядок на пристрої.');return;}
    changes=updated;blocks=next;const y=scrollY;renderSite();scrollTo(0,y);toast('Порядок збережено в макеті');
  });
}
function renderBlock(id,type) {
  const item=(type==='block'?blocks:categoryVideos).find(b=>b.id===id);if(!item){navigate('site');return;}
  draft=copy(item);draftType=type;photoIndex=0;pendingVideo=null;pendingVideoURL='';$('#navigation').hidden=true;
  $('#app').innerHTML=`<div class="page editor">${backHeader(item.label,type==='block'?'Головна сторінка':'Відео в категорії','site')}<form id="edit-form">${item.kind!=='collection'?'<div id="gallery" class="gallery"></div>':''}<section class="section"><h2>${item.kind==='collection'?'Заголовок блоку':item.kind==='category-video'?'Показ відео':'Текст блоку'}</h2>${item.kind!=='category-video'?field('Заголовок','title',item.title,'text','maxlength="240"'):''}${item.kind==='text'?`<label class="field"><span>Опис</span><textarea name="text" maxlength="10000" rows="8">${esc(item.text)}</textarea></label>`:''}${['hero','gallery','text'].includes(item.kind)?field('Текст кнопки','button',item.button,'text','maxlength="80"'):''}${item.kind==='category-video'?'<p class="help">Відео з’явиться у вибраній категорії. У макеті можна перевірити файл та обкладинку.</p>':''}</section>${item.kind==='collection'?`<section class="section"><h2>Прикраси в блоці</h2><p class="help" style="margin:0 0 18px">Оберіть до 8 моделей.</p><div class="mini-products">${products.map(p=>`<label class="pick-product"><input type="checkbox" name="selected-product" value="${p.id}" ${item.productIds.includes(p.id)?'checked':''}><img src="${esc(p.photos[0])}" alt=""><span>${esc(p.name)}</span></label>`).join('')}</div></section>`:''}<section class="section">${switchField('Показувати блок','visible',item.visible,'Вимкнений блок залишається тут, але не відображається у перегляді.')}</section><p class="form-error" id="form-error" role="alert"></p></form>${saveBar()}</div>`;
  gallery();bindEditor('site');
}
function renderPreview() {
  $('#navigation').hidden=true;
  $('#app').innerHTML=`<div class="preview-page"><div class="preview-toolbar"><button class="icon-button" id="preview-back" aria-label="Назад до блоків">${icon('back')}</button><h1>Перегляд макета</h1><span></span></div>${blocks.filter(b=>b.visible).map(b=>{
    if(b.kind==='hero')return `<section class="preview-hero">${videoSource(b)?`<video src="${esc(videoSource(b))}" poster="${esc(b.photos[0])}" controls playsinline preload="none"></video>`:`<img src="${esc(b.photos[0])}" alt="Головне фото">`}<div class="preview-hero-copy"><h2>${esc(b.title)}</h2><span class="static-cta">${esc(b.button)}</span></div></section>`;
    if(b.kind==='collection')return `<section class="preview-section"><h2>${esc(b.title)}</h2><div class="product-grid">${b.productIds.map(id=>products.find(p=>p.id===id)).filter(p=>p&&p.published).map(card).join('')}</div></section>`;
    return `<section class="preview-section">${b.title?`<h2>${esc(b.title)}</h2>`:''}${b.photos.map(src=>`<img src="${esc(src)}" alt="Фото блоку ${esc(b.label)}">`).join('')}${b.text?`<p>${esc(b.text)}</p>`:''}${b.button?`<span class="static-cta">${esc(b.button)}</span>`:''}</section>`;
  }).join('')}<p class="snapshot-note" style="padding:0 20px">Спрощений перегляд для перевірки текстів, фото та порядку. Це не точна копія робочої вітрини. Кнопки в блоках показують лише їхній вигляд.</p></div>`;
  $('#preview-back').onclick=()=>navigate('site');bindCards();
}
async function reset() {
  if(!(await ask('Почати заново?', 'Пробні правки товарів, блоків і вибрані файли буде видалено з цього пристрою. Робочий магазин не зміниться.', 'Скинути макет','Скасувати')))return;
  try {localStorage.removeItem(STORAGE);}catch{toast('Не вдалося очистити сховище.');return;}
  try {const db=await openMediaDB();await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=resolve;tx.onerror=reject;});db.close();}catch{}
  mediaURLs.forEach(URL.revokeObjectURL);mediaURLs.clear();
  changes={products:{},blocks:null,categoryVideos:null};products=copy(INITIAL.products);blocks=copy(INITIAL.blocks);categoryVideos=copy(INITIAL.categoryVideos);query='';category='Усі';visibility='all';listScroll=0;dirty=false;
  renderRoute(route==='site'?'site':'products');toast('Макет повернуто до початкового вигляду');
}
function renderRoute(next) {
  route=next;draft=null;dirty=false;
  const [kind,id]=next.split('/');
  if(kind==='product'&&id)renderProduct(id);
  else if((kind==='block'||kind==='category')&&id)renderBlock(id,kind);
  else if(kind==='site')renderSite();else if(kind==='preview')renderPreview();else {route='products';renderProducts();}
  scrollTo(0,route==='products'?listScroll:0);
}
async function init() {
  for(const b of [...blocks,...categoryVideos])if(b.videoKey) {
    try {const blob=await mediaLoad(b.videoKey);if(blob)mediaURLs.set(b.videoKey,URL.createObjectURL(blob));else b.videoName='Відео не знайдено на пристрої. Оберіть файл ще раз.';}
    catch {b.videoName='Не вдалося відкрити відео. Оберіть файл ще раз.';}
  }
  renderRoute(location.hash.slice(1)||'products');
  if(storageWarning)toast('Сховище браузера недоступне. Збереження може не працювати.');
}
init();
