<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CRM LIMÉRENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap">
<style>
/* Layout: an app shell in the LIMÉRENCE storefront language — white ground, graphite ink, light grey plates under each piece.
   Desktop: left sidebar + content + right drawer for an order. Phone: top bar, bottom tab bar, floating "+", full-screen sheets. */
:root {
  --bg: #ffffff;
  --side: #f8f9fb;
  --plate: #f3f3f3;
  --wash: #ebebeb;
  --ink: #303030;
  --soft: #555555;
  --muted: #727272;
  --line: #e4e4e4;
  --field: #bdbdbd;
  --btn: #303030;
  --btn-hover: #1c1c1c;
  --btn-ink: #ffffff;
  --bar: #c8d3e6;
  --scrim: rgba(20, 20, 20, 0.32);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  --accent: #2f4b7c; --accent-wash: #edf1f8; --accent-ink: #2a4470; --on-accent: #ffffff; --on-status: #ffffff;
  --st-work: #7a7a7a; --work-wash: #f0f0f0;
  --st-ready: #8a6a0e; --ready-wash: #faf3dc;
  --st-done: #477a2e; --done-wash: #ecf4e6;
  --st-late: #a04336; --late-wash: #fbeceb;
  --p-sasha: #7b5cc4; --p-sasha-wash: #f1edfa; --p-angel: #c0622e; --p-angel-wash: #fcefe7; --p-ana: #4a4a4a; --p-ana-wash: #ececec;
  --m-white: #7d8896; --m-white-plate: #eef1f5; --m-yellow: #a07a2c; --m-yellow-plate: #f8f1df; --m-rose: #a8624c; --m-rose-plate: #f8ebe5;
  --logo-filter: none;
  --font-display: 'Raleway', Arial, sans-serif;
  --font-ui: 'Raleway', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --side: #191a1d; --plate: #232323; --wash: #2c2c2c; --ink: #ececec; --soft: #c4c4c4;
    --muted: #9b9b9b; --line: #2e2e2e; --field: #555555; --btn: #ececec; --btn-hover: #ffffff; --btn-ink: #151515;
    --bar: #34405a; --scrim: rgba(0, 0, 0, 0.55); --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    --accent: #8fb0e6; --accent-wash: #1e2638; --accent-ink: #b8ccef; --on-accent: #121a2a; --on-status: #151515;
    --work-wash: #2a2a2a; --ready-wash: #3a3018; --done-wash: #24311c;
    --p-sasha: #9479dc; --p-sasha-wash: #2a2340; --p-angel: #d4773f; --p-angel-wash: #3a2619; --p-ana: #d0d0d0; --p-ana-wash: #2e2e2e;
    --m-white: #aeb8c4; --m-white-plate: #22262c; --m-yellow: #d9b46a; --m-yellow-plate: #2b2619; --m-rose: #dc9a85; --m-rose-plate: #2e221e;
    --st-work: #a8a8a8; --st-ready: #dcb456; --st-done: #9cc77f; --st-late: #e48877; --late-wash: #3a2421;
    --logo-filter: invert(1) brightness(1.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --side: #191a1d; --plate: #232323; --wash: #2c2c2c; --ink: #ececec; --soft: #c4c4c4;
  --muted: #9b9b9b; --line: #2e2e2e; --field: #555555; --btn: #ececec; --btn-hover: #ffffff; --btn-ink: #151515;
  --bar: #34405a; --scrim: rgba(0, 0, 0, 0.55); --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    --accent: #8fb0e6; --accent-wash: #1e2638; --accent-ink: #b8ccef; --on-accent: #121a2a; --on-status: #151515;
    --work-wash: #2a2a2a; --ready-wash: #3a3018; --done-wash: #24311c;
    --p-sasha: #9479dc; --p-sasha-wash: #2a2340; --p-angel: #d4773f; --p-angel-wash: #3a2619; --p-ana: #d0d0d0; --p-ana-wash: #2e2e2e;
    --m-white: #aeb8c4; --m-white-plate: #22262c; --m-yellow: #d9b46a; --m-yellow-plate: #2b2619; --m-rose: #dc9a85; --m-rose-plate: #2e221e;
  --st-work: #a8a8a8; --st-ready: #dcb456; --st-done: #9cc77f; --st-late: #e48877; --late-wash: #3a2421;
  --logo-filter: invert(1) brightness(1.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  font-feature-settings: "lnum" 1;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-feature-settings: "lnum" 1, "tnum" 1; white-space: nowrap; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
.small { font-size: 13px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
h1 { font-weight: 300; font-size: clamp(26px, 4vw, 32px); line-height: 1.1; letter-spacing: -0.005em; }
h2 { font-weight: 400; font-size: 19px; line-height: 1.25; }
h3 { font-weight: 600; font-size: 14px; line-height: 1.3; }
p { margin: 0; }

/* shell */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.mtop {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.logo img { display: block; height: 22px; width: auto; filter: var(--logo-filter); }
.proto {
  font-size: 12.5px; color: var(--muted); background: var(--side); border-bottom: 1px solid var(--line);
  padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.proto button { text-decoration: underline; text-underline-offset: 3px; color: var(--soft); font-size: 12.5px; }
main {
  padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; align-content: start; min-width: 0; max-width: 1180px; width: 100%;
}
.roleseg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; font-size: 13px; }
.roleseg button { padding: 4px 11px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.roleseg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.bnav button { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; font-size: 11px; color: var(--muted); }
.bnav button svg { width: 22px; height: 22px; }
.bnav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.fab {
  position: fixed; z-index: 26; width: 54px; height: 54px; border-radius: 50%;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; box-shadow: var(--shadow);
}
.fab svg { width: 24px; height: 24px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

@media (min-width: 900px) {
  .app { grid-template-columns: 236px minmax(0, 1fr); }
  .side {
    display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh;
    background: var(--side); border-right: 1px solid var(--line); padding: 26px 16px 20px 20px;
  }
  .side .logo img { height: 26px; }
  .mtop, .bnav, .fab { display: none; }
  main { padding-block: 32px 64px; padding-left: 40px; padding-right: 40px; }
  .proto { padding-left: 40px; }
}
.snav { display: grid; gap: 2px; }
.snav button { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 6px; color: var(--soft); text-align: left; }
.snav button:hover { background: var(--wash); color: var(--ink); }
.snav button[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.snav .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.side .foot { margin-top: auto; display: grid; gap: 10px; font-size: 13px; color: var(--muted); }
.side .foot .who { color: var(--ink); font-weight: 500; }
.side .foot button.link { text-align: left; text-decoration: underline; text-underline-offset: 3px; color: var(--soft); font-size: 13px; }

/* page head */
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.phead .t { display: grid; gap: 4px; }
.phead .sub { color: var(--muted); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 4px; background: var(--btn); color: var(--btn-ink); font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--btn-hover); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--field); }
.btn.ghost:hover { background: var(--wash); }
.btn.xl { padding: 7px 12px; font-size: 13px; gap: 6px; text-decoration: none; color: var(--ink); }
.btn.xl svg.i { width: 16px; height: 16px; }
.btn.wide { width: 100%; justify-content: center; }
.btn svg.i { width: 18px; height: 18px; }
.tabs { display: flex; gap: 4px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { padding: 8px 0 9px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 14px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tabs .c { font-size: 12px; margin-left: 4px; color: var(--muted); font-weight: 400; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.search { flex: 1 1 220px; max-width: 360px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--field); border-radius: 4px; padding: 0 10px; }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; }
.search:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
.layoutseg { display: none; }
@media (min-width: 900px) { .layoutseg { display: inline-flex; } }

/* attention strip */
.attn { display: flex; flex-wrap: wrap; gap: 8px; }
.attn button { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; color: var(--soft); background: var(--bg); }
.attn button:hover { border-color: var(--field); }
.attn button b { font-weight: 600; color: var(--ink); }
.attn button.late { background: var(--late-wash); border-color: transparent; color: var(--st-late); }
.attn button.late b { color: var(--st-late); }
.attn button[aria-pressed="true"] { border-color: var(--ink); }

/* status */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--st-work); }
.dot.ready { background: var(--st-ready); }
.dot.done { background: var(--st-done); }
.stbtn { display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px 4px 9px; border-radius: 4px; font-size: 13px; color: var(--soft); border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.stbtn:hover { border-color: var(--field); color: var(--ink); }
.stbtn svg.i { width: 14px; height: 14px; color: var(--muted); }
.stwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 15; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; min-width: 170px; display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 4px; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--wash); }
.menu button[aria-current="true"] { font-weight: 600; }
.menu .hint { font-size: 12px; color: var(--muted); padding: 4px 10px 6px; }

/* order list */
.olist { display: grid; border-top: 1px solid var(--line); }
.orow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 6px 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.orow:hover { background: linear-gradient(90deg, transparent, var(--side) 12%, var(--side)); }
.plate { background: var(--plate); border-radius: 4px; display: grid; place-items: center; color: var(--muted); overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.plate svg { width: 70%; height: 70%; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
.om { display: grid; gap: 2px; min-width: 0; }
.ot { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.oname { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oid { font-size: 12px; color: var(--muted); flex: none; }
.os, .oc { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oc { color: var(--soft); }
.oside { display: grid; justify-items: end; gap: 4px; text-align: right; }
.due { font-size: 13px; color: var(--soft); white-space: nowrap; }
.due.late { color: var(--st-late); font-weight: 600; }
.due.today { color: var(--st-ready); font-weight: 600; }
.bal { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bal b { color: var(--ink); font-weight: 600; }
@media (max-width: 560px) {
  .orow { grid-template-columns: 56px minmax(0, 1fr); }
  .oside { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 6px 12px; text-align: left; padding-left: 70px; }
  .menu { right: auto; left: 0; }
}
.empty { padding: 36px 0; color: var(--muted); }

/* board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { background: var(--side); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.colh { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 2px 2px 4px; }
.colh .c { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--field); }
.card .om { gap: 1px; }
.card .oname { font-size: 14px; }

/* overview */
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.fig { padding: 16px 18px 16px 0; display: grid; gap: 4px; align-content: start; min-width: 0; }
.fig + .fig { padding-left: 18px; border-left: 1px solid var(--line); }
.fig .fl { font-size: 13px; color: var(--muted); }
.fig .fv { font-family: var(--font-display); font-weight: 300; font-size: clamp(24px, 3vw, 32px); line-height: 1.1; }
.fig .fs { font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) {
  .figs { grid-template-columns: 1fr 1fr; }
  .fig:nth-child(3) { padding-left: 0; border-left: 0; }
  .fig:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 40px; }
.block { display: grid; gap: 12px; align-content: start; min-width: 0; }
.blockh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.blockh button { font-size: 13px; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 4px; padding: 6px 9px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -100%); }
.chart .tip b { font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* tables */
.scroll { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
.r { text-align: right; }
tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--ink); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--side); }
td .lock { color: var(--muted); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
td .lock svg.i { width: 13px; height: 13px; }

/* forms */
.form { display: grid; gap: 18px; }
.fgroup { display: grid; gap: 12px; }
.fgroup > .gt { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 4px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld > label, .fld > .lb { font-size: 13px; color: var(--soft); }
.fld input[type="text"], .fld input[type="number"], .fld input[type="tel"], .fld input[type="date"], .fld textarea {
  width: 100%; border: 1px solid var(--field); border-radius: 4px; padding: 9px 11px; background: var(--bg); min-height: 40px;
}
.fld textarea { min-height: 64px; resize: vertical; }
.fld input:focus, .fld textarea:focus { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.fld .hint.ok { color: var(--st-done); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-block; padding: 7px 12px; border: 1px solid var(--field); border-radius: 4px; font-size: 14px; color: var(--soft); white-space: nowrap; }
.seg input:checked + span { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.calc { display: grid; border-top: 1px solid var(--ink); }
.calc > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.calc > div .l { min-width: 0; }
.calc > div .l small { display: block; color: var(--muted); font-size: 12.5px; }
.calc > div.tot { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--ink); }
.calc input { width: 130px; text-align: right; border: 1px solid var(--field); border-radius: 4px; padding: 6px 9px; background: var(--bg); }
.auto { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
.cashcard { border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 16px; max-width: 560px; }
.cashtot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--ink); padding-top: 12px; }
.cashtot .v { font-family: var(--font-display); font-weight: 300; font-size: 28px; }

/* schedule */
.sched { border-collapse: separate; border-spacing: 0; width: auto; min-width: 100%; }
.sched th, .sched td { padding: 0; border: 0; text-align: center; }
.sched thead th { font-size: 11px; color: var(--muted); font-weight: 500; padding: 4px 0 6px; border-bottom: 1px solid var(--line); min-width: 34px; }
.sched thead th.we { color: var(--soft); }
.sched thead th.today { color: var(--ink); font-weight: 700; }
.sched thead th b { display: block; font-size: 13px; color: var(--ink); font-weight: 500; }

  }
  function drawerNew() {
    function radios(name, opts, def) { return '<div class="seg">' + opts.map(function (v) { return '<label><input type="radio" name="' + name + '" value="' + v + '"' + (v === def ? ' checked' : '') + '><span>' + v + '</span></label>'; }).join('') + '</div>'; }
    return '<div class="dhead"><div><div class="tag">№' + nextId + '</div><h2>Новый заказ</h2></div><button type="button" class="x" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div>' +
      '<form class="dbody form" id="newform">' +
      '<div class="fld"><span class="lb">Кто оформляет</span>' + radios('by', ['Саша', 'Ангелина', 'Аня'], me()) + '</div>' +
      '<div class="fgroup"><div class="gt">Изделие</div>' +
      '<div class="fld"><label for="n-t">Название</label><input type="text" id="n-t" name="t" required placeholder="Например, кольцо багет"></div>' +
      '<div class="fld"><span class="lb">Проба</span>' + radios('pr', ['585', '750'], '750') + '</div><div class="fld"><span class="lb">Цвет золота</span>' + radios('col', ['белое', 'жёлтое', 'розовое'], 'белое') + '</div>' +
      '<div class="frow"><div class="fld"><label for="n-sz">Размер</label><input type="text" id="n-sz" name="sz" placeholder="р. 16 или 45 см"></div><div class="fld"><label for="n-ct">Каратность</label><input type="text" id="n-ct" name="ct" placeholder="1 ct"></div></div>' +
      '<div class="fld"><label for="n-det">Детали</label><textarea id="n-det" name="det" placeholder="Застёжка, закрепка, гравировка"></textarea></div>' +
      '<div class="fld"><span class="lb">Фото модели</span><label class="btn ghost filebtn">' + ic('plus') + 'Добавить фото<input type="file" id="n-photo" name="photo" accept="image/*" aria-label="Фото модели"></label><span class="filename" id="n-photo-name"></span></div></div>' +
      '<div class="fgroup"><div class="gt">Деньги</div>' +
      '<div class="frow"><div class="fld"><label for="n-price">Цена, $</label><input type="number" id="n-price" name="price" required min="1" inputmode="decimal" placeholder="0"></div>' +
      (isOwner() ? '<div class="fld"><label for="n-cost">Себестоимость, $</label><input type="number" id="n-cost" name="cost" min="0" inputmode="decimal" placeholder="видишь только ты"></div>' : '') + '</div>' +
      '<div class="frow"><div class="fld"><label for="n-pu">Предоплата, $</label><input type="number" id="n-pu" name="pu" min="0" inputmode="decimal" placeholder="0"></div><div class="fld"><label for="n-ph2">Предоплата, ₴</label><input type="number" id="n-ph2" name="pg" min="0" inputmode="decimal" placeholder="0"></div></div>' +
      '<div class="fld" id="n-eq-wrap" hidden><label for="n-eq">Предоплата в гривнах — это сколько в долларах?</label><input type="number" id="n-eq" name="eq" min="0" inputmode="decimal" placeholder="например, 200"><span class="hint">Нужно, чтобы правильно посчитать остаток к оплате.</span></div>' +
      '<div class="fld"><span class="lb">Способ предоплаты</span>' + radios('pm', ['нал', 'USDT', 'ФОП'], 'нал') + '</div></div>' +
      '<div class="fgroup"><div class="gt">Даты</div><div class="frow"><div class="fld"><label for="n-cr">Дата заказа</label><input type="date" id="n-cr" name="cr" value="' + TODAY_S + '"></div><div class="fld"><label for="n-due">Дата выдачи</label><input type="date" id="n-due" name="due" required value="2026-11-26"></div></div></div>' +
      '<div class="fgroup"><div class="gt">Клиент</div>' +
      '<div class="frow"><div class="fld"><label for="n-cn">Имя</label><input type="text" id="n-cn" name="cn" required></div><div class="fld"><label for="n-ph">Телефон</label><input type="tel" id="n-ph" name="ph" required placeholder="+380"><span class="hint" id="ph-hint"></span></div></div>' +
      '<div class="frow"><div class="fld"><span class="lb">Получение</span>' + radios('del', ['самовывоз', 'почта'], 'самовывоз') + '</div><div class="fld"><span class="lb">Заказ</span>' + radios('ch', ['офлайн', 'онлайн'], 'офлайн') + '</div></div></div>' +
      '<p class="muted small" id="new-err" hidden></p>' +
      '<button type="submit" class="btn wide">Сохранить заказ</button>' +
      '<p class="muted small">Заказ получит статус «в работе», появится в общей таблице, а клиент — в базе клиентов.</p></form>';
  }

  /* ---------- sheets ---------- */
  function sheetMore() {
    return '<div class="blockh"><h2>Ещё</h2><button type="button" class="x" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div><div class="mlinks">' +
      [['clients', 'Клиенты'], ['money', 'Деньги: ФОП, оборот, расходы'], ['salary', 'Зарплаты']].map(function (n) { return '<button type="button" data-act="go" data-v="' + n[0] + '">' + ic(n[0]) + n[1] + '</button>'; }).join('') +
      '<button type="button" data-act="notes">' + ic('orders') + 'Что можно поменять</button></div>';
  }
  function sheetNotes() {
    return '<div class="blockh"><h2>Что можно поменять</h2><button type="button" class="x" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div>' +
      '<p class="soft">Эти пункты мы додумали сами и сделали так, как предложили. Скажи, если где-то иначе.</p><ol>' +
      ['Если платят гривнами, рядом вписывают сумму в долларах.<span>Иначе не посчитать остаток к оплате.</span>',
        'Заказ входит в оборот месяца, когда его выдали.<span>Заказ от 12 июля, выданный 18 августа, считается в августе.</span>',
        'Колонка кассы «счёт ФОП» тоже входит в ФОП за месяц.',
        'Расчёт с производством — это сумма себестоимостей выданных заказов.<span>Можно сделать отдельной суммой, которую ты вносишь сама.</span>',
        'Всю базу клиентов видишь только ты.<span>Девочки видят телефон клиента в его заказе.</span>',
        'Премия, доплата и расходы месяца — в гривнах.',
        'Зарплаты не вычитаются в «Деньги → Магазин».<span>Если нужно, добавим строку.</span>',
        'Закрытый день кассы правит только ты. Удалить заказ тоже можешь только ты.<span>В истории заказа видно, кто и когда что изменил.</span>',
        'Месяц закрываешь ты, на экране «Зарплаты».<span>После закрытия итоги и зарплаты фиксируются, а кассу и выданные заказы этого месяца правишь только ты.</span>',
        'Если сумма дня не сходится с отчётом программы, день всё равно сохраняется, но подсвечивается.',
        'Выгрузка в Excel есть только у тебя.<span>В ней телефоны клиентов, поэтому девочкам её не показываем.</span>',
        'Готовый заказ, который не забрали после даты выдачи, помечается «не забирают N дней».'
      ].map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>';
  }

  /* ---------- render ---------- */
  function allowed(v) { return (isOwner() ? NAV_OWNER : NAV_STAFF).some(function (n) { return n[0] === v; }); }
  function render() {
    if (!allowed(S.view)) S.view = 'orders';
    renderShell();
    var v = { overview: viewOverview, orders: viewOrders, cash: viewCash, schedule: viewSchedule, clients: viewClients, money: viewMoney, salary: viewSalary }[S.view];
    var main = $('main'), same = S.shown === S.view;
    var keep = same ? Array.prototype.map.call(main.querySelectorAll('.scroll'), function (e) { return e.scrollLeft; }) : null;
    main.innerHTML = v();
    main.querySelectorAll('[data-chart]').forEach(function (el) { barChart(el, el.getAttribute('data-chart')); });
    if (keep) main.querySelectorAll('.scroll').forEach(function (e, i) { e.scrollLeft = keep[i] || 0; });
    else if (S.view === 'schedule') {
      // open the month on today, so the phone does not start at the 1st
      var th = main.querySelector('.sched th.today'), sc = main.querySelector('.scroll');
      if (th && sc) sc.scrollLeft = Math.max(0, th.offsetLeft - sc.clientWidth / 2);
    }
    S.shown = S.view;
    renderOverlays();
  }
  function renderOverlays() {
    var d = $('drawer'), sh = $('sheet');
    if (S.open) {
      var o = S.open === 'new' ? null : ORDERS.find(function (x) { return x.id === S.open; });
      d.innerHTML = o ? drawerOrder(o) : drawerNew();
      d.hidden = false;
    } else d.hidden = true;
    if (S.sheet) { sh.innerHTML = S.sheet === 'more' ? sheetMore() : sheetNotes(); sh.hidden = false; } else sh.hidden = true;
    $('scrim').hidden = !(S.open || S.sheet);
    document.body.style.overflow = (S.open || S.sheet) ? 'hidden' : '';
  }
  function refreshList() { var l = $('olist'); if (l) l.innerHTML = (S.layout === 'board' && window.matchMedia('(min-width: 900px)').matches) ? boardHtml() : S.filter === 'archive' ? archiveHtml() : listHtml(); }

  /* ---------- actions ---------- */
  function setStatus(o, st) {
    if (st === o.st) return;
    if (st === 'done') { S.open = o.id; S.form = 'handover'; S.menu = null; render(); return; }
    o.st = st; delete o.iss;
    o.log.push({ d: TODAY_S, t: 'Статус «' + ST[st] + '»', by: me() });
    toast('Заказ №' + o.id + ': ' + ST[st]);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (S.menu && !(a && (a.getAttribute('data-act') === 'setst' || a.getAttribute('data-act') === 'stmenu'))) { S.menu = null; if (!a) { render(); return; } }
    if (!a) return;
    var act = a.getAttribute('data-act'), id = +a.getAttribute('data-id'), o = ORDERS.find(function (x) { return x.id === id; });
    switch (act) {
      case 'go': S.view = a.getAttribute('data-v'); S.sheet = null; S.open = null; S.form = null; window.scrollTo(0, 0); break;
      case 'role': S.role = a.getAttribute('data-r'); S.open = null; S.form = null; S.sheet = null; S.view = isOwner() ? 'overview' : 'orders'; break;
      case 'who': S.who = a.getAttribute('data-w'); break;
      case 'theme': S.theme = a.getAttribute('data-th'); applyTheme(); break;
      case 'more': S.sheet = 'more'; break;
      case 'notes': S.sheet = 'notes'; break;
      case 'close': S.open = null; S.form = null; S.sheet = null; break;
      case 'filter': if (['late', 'today', 'owed', 'wait'].indexOf(a.getAttribute('data-f')) >= 0) S.layout = 'list'; S.filter = S.filter === a.getAttribute('data-f') && ['late', 'today', 'owed', 'wait'].indexOf(S.filter) >= 0 ? 'current' : a.getAttribute('data-f'); break;
      case 'layout': S.layout = a.getAttribute('data-l'); break;
      case 'arch': S.arch = a.getAttribute('data-m'); refreshList(); return;
      case 'open': S.open = id; S.form = null; break;
      case 'new': S.open = 'new'; S.form = null; break;
      case 'stmenu': e.stopPropagation(); S.menu = S.menu === id ? null : id; break;
      case 'setst': setStatus(o, a.getAttribute('data-st')); S.menu = null; if (S.form) return; break;
      case 'ready': setStatus(o, 'ready'); break;
      case 'handover': S.form = 'handover'; break;
      case 'addpay': S.form = 'pay'; break;
      case 'cancelform': S.form = null; break;
      case 'shift': {
        var k = a.getAttribute('data-d'), p = a.getAttribute('data-p'), arr = SHIFTS[k], i = arr.indexOf(p);
        if (i >= 0) arr.splice(i, 1); else arr.push(p);
        break;
      }
      case 'cashday': S.cashDay = a.getAttribute('data-d'); window.scrollTo(0, 0); break;
      case 'reopenday': { var kd = S.cashDay; DRAFTS[kd] = Object.assign({}, CASH[kd]); delete DRAFTS[kd].closed; delete CASH[kd]; toast('День открыт для правки'); break; }
      case 'closemonth': {
        var rt = rateNow();
        if (!rt) { toast('Впиши курс доллара'); $('rate').focus(); return; }
        var snap = { shop: shopVal(MONTH), orders: ordersVal(MONTH), profit: ordersVal(MONTH) - ordersCost(MONTH), fop: fopMonth(MONTH), sal: {} };
        GIRLS.forEach(function (g) { snap.sal[g] = salaryOf(g, rt); });
        CLOSED[MONTH] = { rate: rt, d: TODAY_S, snap: snap }; toast('Октябрь закрыт, итоги зафиксированы'); break;
      }
      case 'openmonth': S.rate = rf(CLOSED[MONTH].rate); delete CLOSED[MONTH]; toast('Октябрь снова открыт'); break;
      case 'xl': { var xk = a.getAttribute('data-k'), xm = a.getAttribute('data-m'); if (isOwner()) withXlsx(function (X) { XL[xk](X, xm); }); return; }
      case 'client': { var ph = a.getAttribute('data-ph'); S.clientOpen = S.clientOpen === ph ? null : ph; break; }
      case 'copy': {
        var txt = a.getAttribute('data-t');
        try { navigator.clipboard.writeText(txt).then(function () { toast('Телефон скопирован'); }, function () { selectPhone(a); }); } catch (err) { selectPhone(a); }
        return;
      }
      default: return;
    }
    render();
  });
  function selectPhone(a) { var s = a.previousElementSibling; if (!s) return; var r = document.createRange(); r.selectNodeContents(s); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Номер выделен, скопируйте вручную'); }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (S.open || S.sheet || S.menu)) { S.open = null; S.sheet = null; S.menu = null; S.form = null; render(); return; }
    var row = e.target.closest && e.target.closest('.orow');
    if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.open = +row.getAttribute('data-id'); render(); }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { S.q = t.value; refreshList(); return; }
    if (t.hasAttribute('data-cash')) {
      var cd = dayDraft(S.cashDay || TODAY_S), fk = t.getAttribute('data-cash');
      cd[fk] = t.value === '' ? (fk === 'prog' ? null : 0) : +t.value;
      $('c-total').textContent = uah(dayTotal(cd)); $('c-check').innerHTML = checkHtml(cd); return;
    }
    if (t.hasAttribute('data-rate')) { S.rate = t.value; updateSalary(); return; }
    if (t.hasAttribute('data-exp')) { EXP[t.getAttribute('data-exp')] = +t.value || 0; $('m-shop').textContent = uah(shopVal(MONTH) - (EXP.suppliers + EXP.target + EXP.rent + EXP.other)); return; }
    if (t.hasAttribute('data-bonus')) { BONUS[t.getAttribute('data-bonus')][t.getAttribute('data-k')] = +t.value || 0; updateSalary(); return; }
    if (t.hasAttribute('data-cost')) { var o = ORDERS.find(function (x) { return x.id === +t.getAttribute('data-cost'); }); o.cost = +t.value || 0; $('o-profit').textContent = usd(o.price - o.cost); return; }
    if (t.id === 'n-ph2') { $('n-eq-wrap').hidden = !(+t.value > 0); return; }
    if (t.id === 'n-ph') {
      var d = digits(t.value), h = $('ph-hint'), found = d.length >= 9 ? clients().find(function (c) { return digits(c.ph).slice(-9) === d.slice(-9); }) : null;
      h.className = 'hint' + (found ? ' ok' : '');
      h.textContent = found ? 'Уже в базе: ' + found.name + ', ' + found.orders.length + ' ' + plural(found.orders.length, 'заказ', 'заказа', 'заказов') : '';
      if (found) { var cn = $('n-cn'); if (!cn.value) cn.value = found.name; }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'pcur') { $('p-usd-wrap').hidden = t.value !== 'UAH'; return; }
    if (t.name === 'cby') { dayDraft(S.cashDay || TODAY_S).by = t.value; return; }
    if (t.id === 'n-photo') { $('n-photo-name').textContent = t.files[0] ? t.files[0].name : ''; return; }
    if (t.hasAttribute('data-photo')) { readPhoto(t.files[0], function (url) { var o = ORDERS.find(function (x) { return x.id === +t.getAttribute('data-photo'); }); o.photo = url; render(); toast('Фото добавлено'); }); }
  });
  function readPhoto(f, cb) { if (!f) return; var r = new FileReader(); r.onload = function () { cb(r.result); }; r.readAsDataURL(f); }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'cashform') {
      var kd = f.getAttribute('data-d'), c = Object.assign({}, dayDraft(kd), { closed: true });
      CASH[kd] = c; delete DRAFTS[kd];
      var dl = c.prog == null ? 0 : dayTotal(c) - c.prog;
      toast(dl ? 'День сохранён с расхождением ' + uah(Math.abs(dl)) : 'Касса за ' + fd(kd) + ' закрыта: ' + uah(dayTotal(c)));
      render(); return;
    }
    if (f.id === 'payform') {
      var o = ORDERS.find(function (x) { return x.id === +f.getAttribute('data-id'); });
      var cur = f.querySelector('[name="pcur"]:checked').value, amt = +$('p-amt').value || 0, m = f.querySelector('[name="pm"]:checked').value;
      var u = cur === 'USD' ? amt : (+$('p-usd').value || 0);
      if (cur === 'UAH' && amt > 0 && !u) { $('p-usd').focus(); toast('Укажите, сколько это в долларах'); return; }
      if (amt > 0) o.pays.push(P(TODAY_S, amt, cur, u, m, me()));
      if (f.getAttribute('data-mode') === 'handover') {
        o.st = 'done'; o.iss = TODAY_S; o.log.push({ d: TODAY_S, t: 'Выдан клиенту', by: me() });
        toast('Заказ №' + o.id + ' выдан, вошёл в оборот октября');
      } else if (amt > 0) toast('Платёж записан');
      S.form = null; render(); return;
    }
    if (f.id === 'newform') {
      var fd2 = new FormData(f), pu = +fd2.get('pu') || 0, pg = +fd2.get('pg') || 0, eq = +fd2.get('eq') || 0, by = fd2.get('by');
      var err = $('new-err');
      if (pg > 0 && !eq) { err.hidden = false; err.textContent = 'Укажите, сколько гривневая предоплата в долларах.'; $('n-eq').focus(); return; }
      var o2 = { id: nextId++, t: fd2.get('t'), k: kindOf(fd2.get('t')), pr: fd2.get('pr'), col: fd2.get('col'), sz: fd2.get('sz'), ct: fd2.get('ct'), det: fd2.get('det'),
        price: +fd2.get('price'), cost: +fd2.get('cost') || 0, by: by, cn: fd2.get('cn'), ph: fd2.get('ph'), del: fd2.get('del'), ch: fd2.get('ch'),
        cr: fd2.get('cr') || TODAY_S, due: fd2.get('due'), st: 'work', pays: [], log: [] };
      if (pu > 0) o2.pays.push(P(o2.cr, pu, 'USD', pu, fd2.get('pm'), by));
      if (pg > 0) o2.pays.push(P(o2.cr, pg, 'UAH', eq, fd2.get('pm'), by));
      var file = $('n-photo').files[0];
      var done = function () { ORDERS.push(o2); S.open = o2.id; S.view = 'orders'; S.filter = 'current'; render(); toast('Заказ №' + o2.id + ' сохранён'); };
      if (file) readPhoto(file, function (url) { o2.photo = url; done(); }); else done();
    }
  });
  function kindOf(t) {
    t = String(t || '').toLowerCase();
    if (/пусет|серьг|конго/.test(t)) return 'studs';
    if (/цеп/.test(t)) return 'chain';
    if (/подвес|кулон/.test(t)) return 'pendant';
    if (/браслет/.test(t)) return 'bracelet';
    return 'ring';
  }
  window.addEventListener('resize', function () { if (S.view === 'orders' && S.layout === 'board') refreshList(); });

  (function () {
    var saved = null;
    try { saved = localStorage.getItem('limerence-crm-theme'); } catch (err) {}
    S.theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme();
  })();
  render();
})();
</script>

</body>
</html>
